<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0a;
  --card: #141414;
  --card2: #1a1a1a;
  --border: #222;
  --border2: #2e2e2e;
  --accent: #c8f135;
  --accent2: #a8d420;
  --text: #efefef;
  --muted: #555;
  --muted2: #777;
  --danger: #ff4d4d;
  --radius: 12px;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  display: flex; flex-direction: column;
  min-height: 100vh;
}

/* ── TOP BAR ── */
.top-bar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(10,10,10,0.95);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  padding: 12px 20px;
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.logo { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 2px; color: var(--accent); }
.btn-new-session {
  background: var(--accent); color: #000; border: none; border-radius: 8px;
  padding: 7px 14px; font-family: 'DM Sans', sans-serif;
  font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.15s;
}
.btn-new-session:hover { background: var(--accent2); }
.btn-new-session.hidden { display: none; }

/* ── BOTTOM NAV ── */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  background: rgba(10,10,10,0.97);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--border);
  display: flex;
}
.nav-tab {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 3px; padding: 10px 0 12px;
  background: none; border: none; color: var(--muted2);
  font-family: 'DM Sans', sans-serif; font-size: 10px; letter-spacing: 0.5px;
  cursor: pointer; transition: color 0.15s; text-transform: uppercase;
}
.nav-tab .icon { font-size: 20px; line-height: 1; }
.nav-tab.active { color: var(--accent); }

/* ── PAGES ── */
.page { display: none; flex: 1; overflow-y: auto; padding-bottom: 80px; }
.page.active { display: block; }

/* ── MAIN CONTENT ── */
.main { max-width: 600px; margin: 0 auto; padding: 20px 16px; }

/* ── DATE NAV ── */
.date-nav {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 24px; background: var(--card);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 10px 14px;
}
.date-nav button {
  background: none; border: 1px solid var(--border2); color: var(--muted2);
  border-radius: 6px; width: 32px; height: 32px; cursor: pointer;
  font-size: 16px; transition: all 0.15s;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.date-nav button:hover { border-color: var(--accent); color: var(--accent); }
.date-nav .date-center { flex: 1; text-align: center; }
.date-nav .date-label {
  font-family: 'Bebas Neue', sans-serif; font-size: 20px;
  letter-spacing: 2px; color: var(--text); cursor: pointer;
}
.date-nav .date-label:hover { color: var(--accent); }
.sessions-count { font-size: 11px; color: var(--muted); margin-top: 2px; }
.sessions-dots { display: flex; gap: 4px; justify-content: center; flex-shrink: 0; }
.sdot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--border2); cursor: pointer; transition: background 0.15s;
}
.sdot.active { background: var(--accent); }
.sdot:hover { background: var(--accent2); }

/* ── SECTION ── */
.section { margin-bottom: 22px; animation: fadeUp 0.3s ease both; }
.section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.section-title {
  font-family: 'Bebas Neue', sans-serif; font-size: 20px;
  letter-spacing: 2px; color: var(--accent); cursor: pointer;
}
.section-title:hover { color: var(--accent2); }
.section-line { flex:1; height:1px; background: var(--border); }
.btn-icon {
  background: none; border: 1px solid var(--border2); color: var(--muted);
  border-radius: 6px; width: 28px; height: 28px; cursor: pointer;
  font-size: 14px; transition: all 0.15s;
  display: flex; align-items: center; justify-content: center;
}
.btn-icon.danger:hover { border-color: var(--danger); color: var(--danger); }

/* ── EXERCISE ── */
.exercise {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px;
}
.exercise-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.exercise-name {
  flex: 1; font-size: 14px; font-weight: 500;
  background: none; border: none; color: var(--text);
  font-family: 'DM Sans', sans-serif;
  border-bottom: 1px dashed transparent; transition: border-color 0.15s;
  padding: 2px 0;
}
.exercise-name:focus { outline: none; border-bottom-color: var(--accent); }
.sets-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: flex-end; }

/* ── SET CHIP ── */
.set-chip { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.set-input-wrap {
  background: var(--card2); border: 1px solid var(--border2);
  border-radius: 6px; width: 52px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  transition: border-color 0.15s, background 0.15s; position: relative;
}
.set-chip.last .set-input-wrap {
  background: rgba(200,241,53,0.08); border-color: rgba(200,241,53,0.25);
}
.set-input-wrap:focus-within { border-color: var(--accent); background: #1d2200; }
.set-val {
  width: 100%; height: 100%; text-align: center;
  background: none; border: none; outline: none;
  font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
  color: var(--text); padding: 0 4px;
}
.set-chip.last .set-val { color: var(--accent); }
.set-lbl { font-size: 9px; color: var(--muted); letter-spacing: 0.4px; }
.btn-rm-set {
  background: none; border: 1px dashed var(--border2); color: var(--muted);
  border-radius: 6px; width: 28px; height: 34px; cursor: pointer;
  font-size: 16px; display: flex; align-items: center; justify-content: center;
  transition: all 0.15s; flex-shrink: 0; align-self: flex-start; margin-top: 0;
}
.btn-rm-set:hover { border-color: var(--danger); color: var(--danger); }
.btn-add-set {
  background: none; border: 1px dashed var(--border2); color: var(--muted);
  border-radius: 6px; width: 52px; height: 34px; cursor: pointer;
  font-size: 18px; display: flex; align-items: center; justify-content: center;
  transition: all 0.15s; flex-shrink: 0;
}
.btn-add-set:hover { border-color: var(--accent); color: var(--accent); }

/* ── ADD BUTTONS ── */
.btn-add-exercise {
  width: 100%; background: none; border: 1px dashed var(--border2);
  color: var(--muted2); border-radius: var(--radius); padding: 10px;
  cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 13px;
  transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 6px;
}
.btn-add-exercise:hover { border-color: var(--accent); color: var(--accent); }
.btn-add-section {
  width: 100%; background: none; border: 1px dashed var(--border2);
  color: var(--muted2); border-radius: var(--radius); padding: 12px;
  cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 13px;
  transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 6px;
  margin-top: 8px;
}
.btn-add-section:hover { border-color: var(--accent); color: var(--accent); }

/* ── EMPTY STATE ── */
.empty-state { text-align: center; padding: 48px 20px; color: var(--muted); }
.empty-state .icon { font-size: 40px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; line-height: 1.6; }
.empty-state .hint { font-size: 12px; margin-top: 8px; font-style: italic; }

/* ── MODAL ── */
.modal-overlay {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.75); backdrop-filter: blur(4px);
  align-items: center; justify-content: center; padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--card); border: 1px solid var(--border2);
  border-radius: 16px; padding: 24px; width: 100%; max-width: 380px;
  animation: popIn 0.2s ease;
}
.modal h3 {
  font-family: 'Bebas Neue', sans-serif; font-size: 22px;
  letter-spacing: 2px; color: var(--accent); margin-bottom: 16px;
}
.modal input[type="date"], .modal input[type="text"] {
  width: 100%; background: var(--card2); border: 1px solid var(--border2);
  color: var(--text); border-radius: 8px; padding: 10px 14px;
  font-family: 'DM Sans', sans-serif; font-size: 14px; margin-bottom: 12px;
}
.modal input:focus { outline: none; border-color: var(--accent); }
.modal-actions { display: flex; gap: 8px; margin-top: 4px; }
.btn-confirm {
  flex:1; background: var(--accent); color: #000; border: none;
  border-radius: 8px; padding: 10px; font-family: 'DM Sans', sans-serif;
  font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.15s;
}
.btn-confirm:hover { background: var(--accent2); }
.btn-cancel {
  flex:1; background: none; color: var(--muted2); border: 1px solid var(--border2);
  border-radius: 8px; padding: 10px; font-family: 'DM Sans', sans-serif;
  font-size: 14px; cursor: pointer; transition: all 0.15s;
}
.btn-cancel:hover { border-color: var(--text); color: var(--text); }

/* ── HISTORY PANEL ── */
.history-panel {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.75); backdrop-filter: blur(4px);
  align-items: flex-end; justify-content: center;
}
.history-panel.open { display: flex; }
.history-inner {
  background: var(--card); border-top: 1px solid var(--border2);
  border-radius: 20px 20px 0 0; width: 100%; max-width: 600px;
  padding: 20px 16px 48px; max-height: 80vh; overflow-y: auto;
  animation: slideUp 0.25s ease;
}
.history-inner h3 {
  font-family: 'Bebas Neue', sans-serif; font-size: 22px;
  letter-spacing: 2px; color: var(--accent); margin-bottom: 16px;
}
.history-entry {
  background: var(--card2); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 14px; margin-bottom: 8px;
  cursor: pointer; transition: border-color 0.15s;
  display: flex; justify-content: space-between; align-items: center;
}
.history-entry:hover { border-color: var(--accent); }
.history-entry .h-date { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 1px; }
.history-entry .h-exercises { font-size: 12px; color: var(--muted2); margin-top: 2px; }
.history-entry .h-icon { font-size: 18px; color: var(--muted); }
.history-entry.active-entry { border-color: var(--accent); background: rgba(200,241,53,0.05); }
.close-panel {
  background: none; border: 1px solid var(--border2); color: var(--muted2);
  border-radius: 8px; padding: 8px 16px; cursor: pointer;
  font-family: 'DM Sans', sans-serif; font-size: 13px;
  margin-bottom: 16px; transition: all 0.15s;
}
.close-panel:hover { border-color: var(--text); color: var(--text); }
.no-history { text-align: center; color: var(--muted); font-size: 13px; padding: 20px; }

/* ── PROGRESS PAGE ── */
.progress-main { max-width: 600px; margin: 0 auto; padding: 20px 16px; }
.progress-header { margin-bottom: 20px; }
.progress-header h2 {
  font-family: 'Bebas Neue', sans-serif; font-size: 28px;
  letter-spacing: 2px; color: var(--accent);
}
.progress-header p { font-size: 13px; color: var(--muted2); margin-top: 4px; }

.filter-row {
  display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px;
}
.filter-chip {
  background: var(--card); border: 1px solid var(--border2); color: var(--muted2);
  border-radius: 20px; padding: 5px 12px; font-size: 12px; cursor: pointer;
  transition: all 0.15s; font-family: 'DM Sans', sans-serif;
}
.filter-chip:hover { border-color: var(--accent); color: var(--accent); }
.filter-chip.active { background: rgba(200,241,53,0.1); border-color: var(--accent); color: var(--accent); }

.ex-progress-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px;
  margin-bottom: 14px; animation: fadeUp 0.3s ease both;
}
.ex-progress-card:hover { border-color: var(--border2); }
.ex-progress-top {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: 14px;
}
.ex-progress-name { font-size: 14px; font-weight: 600; color: var(--text); }
.ex-progress-group { font-size: 11px; color: var(--muted); margin-top: 2px; }
.ex-stats { display: flex; gap: 16px; }
.ex-stat { text-align: right; }
.ex-stat .val {
  font-family: 'Bebas Neue', sans-serif; font-size: 22px;
  letter-spacing: 1px; color: var(--accent); line-height: 1;
}
.ex-stat .lbl { font-size: 10px; color: var(--muted); margin-top: 1px; letter-spacing: 0.5px; }
.ex-stat .val.up { color: var(--accent); }
.ex-stat .val.same { color: var(--muted2); }

/* ── SVG CHART ── */
.chart-wrap { position: relative; width: 100%; }
svg.sparkline { width: 100%; overflow: visible; display: block; }
.chart-x-labels {
  display: flex; justify-content: space-between;
  margin-top: 4px; padding: 0 2px;
}
.chart-x-labels span { font-size: 9px; color: var(--muted); }

.no-progress {
  text-align: center; padding: 48px 20px; color: var(--muted);
}
.no-progress .icon { font-size: 36px; margin-bottom: 12px; }
.no-progress p { font-size: 13px; line-height: 1.6; }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 72px; left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--accent); color: #000; border-radius: 8px;
  padding: 10px 20px; font-size: 13px; font-weight: 600;
  opacity: 0; transition: all 0.3s; z-index: 300; pointer-events: none;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── ANIMATIONS ── */
@keyframes fadeUp { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
@keyframes popIn { from { opacity:0; transform: scale(0.95); } to { opacity:1; transform: scale(1); } }
@keyframes slideUp { from { transform: translateY(30px); opacity:0; } to { transform: translateY(0); opacity:1; } }

input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.6); cursor: pointer; }
</style>
</head>
<body>

<div class="top-bar">
  <div class="logo">GYM LOG</div>
  <button class="btn-new-session" id="btnNewSession" onclick="openNewSession()">+ Nueva sesión</button>
</div>

<!-- PAGE: LOG -->
<div class="page active" id="pageLog">
  <div class="main">
    <div class="date-nav">
      <button onclick="prevSession()">&#8592;</button>
      <div class="date-center">
        <div class="date-label" onclick="openHistory()" id="dateLabel">—</div>
        <div class="sessions-count" id="sessionsCount"></div>
      </div>
      <div class="sessions-dots" id="sessionsDots"></div>
      <button onclick="nextSession()">&#8594;</button>
    </div>
    <div id="appContent"></div>
  </div>
</div>

<!-- PAGE: PROGRESS -->
<div class="page" id="pageProgress">
  <div class="progress-main">
    <div class="progress-header">
      <h2>Progreso</h2>
      <p>Evolución del peso máximo por ejercicio</p>
    </div>
    <div class="filter-row" id="filterRow"></div>
    <div id="progressContent"></div>
  </div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <button class="nav-tab active" id="tabLog" onclick="switchTab('log')">
    <span class="icon">📋</span>
    <span>Entreno</span>
  </button>
  <button class="nav-tab" id="tabProgress" onclick="switchTab('progress')">
    <span class="icon">📈</span>
    <span>Progreso</span>
  </button>
</div>

<!-- Modals -->
<div class="modal-overlay" id="modalNewSession">
  <div class="modal">
    <h3>Nueva Sesión</h3>
    <input type="date" id="newSessionDate">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('modalNewSession')">Cancelar</button>
      <button class="btn-confirm" onclick="confirmNewSession()">Crear</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="modalNewSection">
  <div class="modal">
    <h3>Nuevo Grupo</h3>
    <input type="text" id="newSectionName" placeholder="ej. Chest, Back, Arms…">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('modalNewSection')">Cancelar</button>
      <button class="btn-confirm" onclick="confirmNewSection()">Añadir</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="modalRenameSection">
  <div class="modal">
    <h3>Renombrar</h3>
    <input type="text" id="renameSectionVal" placeholder="Nuevo nombre">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('modalRenameSection')">Cancelar</button>
      <button class="btn-confirm" onclick="confirmRenameSection()">Guardar</button>
    </div>
  </div>
</div>

<!-- Confirm Delete Session Modal -->
<div class="modal-overlay" id="modalConfirmDelete">
  <div class="modal">
    <h3>Eliminar sesión</h3>
    <p style="font-size:14px;color:var(--muted2);margin-bottom:20px;">¿Eliminar la sesión del <strong id="confirmDeleteLabel" style="color:var(--text)"></strong>? Esta acción no se puede deshacer.</p>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('modalConfirmDelete')">Cancelar</button>
      <button class="btn-confirm" style="background:var(--danger);color:#fff;" onclick="confirmDeleteSession()">Eliminar</button>
    </div>
  </div>
</div>

<!-- History Panel -->
<div class="history-panel" id="historyPanel">
  <div class="history-inner">
    <button class="close-panel" onclick="closeHistory()">✕ Cerrar</button>
    <h3>Historial</h3>
    <div id="historyList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'gymlog_v2';
let data = {};
let currentDate = null;
let renameSectionId = null;
let pendingDeleteDate = null;
let activeFilter = 'all';
let currentTab = 'log';

// ── PERSISTENCE (window.storage API - persists across sessions) ──
// Save each session as its own key: "gymlog:YYYY-MM-DD"
// Also save an index key with all dates for fast listing

function save() {
  // Fire-and-forget async save — never blocks UI
  _saveAsync().catch(e => console.warn('save error', e));
}

async function _saveAsync() {
  const dates = Object.keys(data);
  // Save index
  await window.storage.set('gymlog:index', JSON.stringify(dates));
  // Save each session
  for (const date of dates) {
    await window.storage.set('gymlog:' + date, JSON.stringify(data[date]));
  }
}

async function load() {
  try {
    const indexResult = await window.storage.get('gymlog:index');
    if (!indexResult) { data = {}; }
    else {
      const dates = JSON.parse(indexResult.value);
      data = {};
      for (const date of dates) {
        try {
          const r = await window.storage.get('gymlog:' + date);
          if (r) data[date] = JSON.parse(r.value);
        } catch(e) { /* skip corrupted session */ }
      }
    }
  } catch(e) {
    data = {};
  }
  if (Object.keys(data).length === 0) seedDefault();
}

// Also patch deleteSession to remove from storage
async function _deleteFromStorage(date) {
  try {
    await window.storage.delete('gymlog:' + date);
    const dates = Object.keys(data);
    await window.storage.set('gymlog:index', JSON.stringify(dates));
  } catch(e) { console.warn('delete error', e); }
}
function uid() { return Math.random().toString(36).slice(2, 9); }

function seedDefault() {
  const date = '2025-05-04';
  data[date] = { sections: [
    { id: uid(), name: 'Leg Day', exercises: [
      { id: uid(), name: 'Peso muerto', sets: ['15','15','15','20'] },
      { id: uid(), name: 'Gemelos', sets: ['50','55','55','55','60'] },
      { id: uid(), name: 'Gemelos sentado', sets: ['20','30','40','40'] },
      { id: uid(), name: 'Prensa pierna', sets: ['50','60','70','80'] },
      { id: uid(), name: 'Prensa pierna individual', sets: ['30','40','50','50'] },
      { id: uid(), name: 'Sentadilla guiada', sets: ['10','15','15','16.25'] },
    ]},
    { id: uid(), name: 'Chest', exercises: [
      { id: uid(), name: 'Press banca', sets: ['12.5','12.5','15','15'] },
      { id: uid(), name: 'Pecho inclinado', sets: ['15','20','25','27.5'] },
      { id: uid(), name: 'Pecho apertura', sets: ['35','50'] },
    ]},
    { id: uid(), name: 'Shoulders', exercises: [
      { id: uid(), name: 'Máquina sentado', sets: ['5','5','5','7.5'] },
    ]},
    { id: uid(), name: 'Bíceps', exercises: [
      { id: uid(), name: 'Cable individual', sets: ['15','15','17.5','20'] },
      { id: uid(), name: 'Cable con barra', sets: ['30','32','35','37'] },
      { id: uid(), name: 'Máquina sentado', sets: ['20','20','20','22.5'] },
    ]},
    { id: uid(), name: 'Tríceps', exercises: [
      { id: uid(), name: 'Dos cuerdas', sets: ['30','32.5','32.5','35'] },
      { id: uid(), name: 'Solo cable', sets: ['15','15','17.5','17.5'] },
    ]},
  ]};
  save();
}

// ── TABS ──
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('pageLog').classList.toggle('active', tab === 'log');
  document.getElementById('pageProgress').classList.toggle('active', tab === 'progress');
  document.getElementById('tabLog').classList.toggle('active', tab === 'log');
  document.getElementById('tabProgress').classList.toggle('active', tab === 'progress');
  document.getElementById('btnNewSession').classList.toggle('hidden', tab !== 'log');
  if (tab === 'progress') renderProgress();
}

// ── SORTED DATES ──
function sortedDates() { return Object.keys(data).sort(); }
function currentIndex() { return sortedDates().indexOf(currentDate); }

function prevSession() {
  const dates = sortedDates(), i = currentIndex();
  if (i > 0) { currentDate = dates[i-1]; renderLog(); }
}
function nextSession() {
  const dates = sortedDates(), i = currentIndex();
  if (i < dates.length-1) { currentDate = dates[i+1]; renderLog(); }
}

function formatDate(d) {
  if (!d) return '—';
  const [y,m,day] = d.split('-');
  const months = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return `${parseInt(day)} ${months[parseInt(m)-1]} ${y}`;
}
function shortDate(d) {
  if (!d) return '';
  const [y,m,day] = d.split('-');
  return `${parseInt(day)}/${parseInt(m)}`;
}

// ── RENDER LOG ──
function renderLog() {
  const dates = sortedDates();
  const idx = currentIndex();
  document.getElementById('dateLabel').textContent = formatDate(currentDate);
  document.getElementById('sessionsCount').textContent =
    dates.length ? `Sesión ${idx+1} de ${dates.length}` : '';

  const dotsEl = document.getElementById('sessionsDots');
  dotsEl.innerHTML = '';
  const showDots = Math.min(dates.length, 7);
  const start = Math.max(0, Math.min(idx-3, dates.length-showDots));
  for (let i = start; i < start+showDots && i < dates.length; i++) {
    const dot = document.createElement('div');
    dot.className = 'sdot' + (i===idx ? ' active' : '');
    dot.title = formatDate(dates[i]);
    const d = dates[i];
    dot.onclick = () => { currentDate = d; renderLog(); };
    dotsEl.appendChild(dot);
  }

  const content = document.getElementById('appContent');
  content.innerHTML = '';
  if (!currentDate || !data[currentDate]) {
    content.innerHTML = `<div class="empty-state"><div class="icon">🏋️</div><p>No hay sesiones todavía.<br>Crea una nueva sesión para empezar.</p><p class="hint">Pulsa "+ Nueva sesión" arriba</p></div>`;
    return;
  }

  data[currentDate].sections.forEach((section, si) => {
    const sEl = document.createElement('div');
    sEl.className = 'section';
    sEl.style.animationDelay = `${si*0.05}s`;
    sEl.innerHTML = `
      <div class="section-header">
        <span class="section-title" onclick="openRenameSection('${section.id}')">${section.name}</span>
        <div class="section-line"></div>
        <button class="btn-icon danger" onclick="deleteSection('${section.id}')">✕</button>
      </div>
      <div id="exercises-${section.id}"></div>
      <button class="btn-add-exercise" onclick="addExercise('${section.id}')">+ Añadir ejercicio</button>
    `;
    const exCont = sEl.querySelector(`#exercises-${section.id}`);
    section.exercises.forEach(ex => exCont.appendChild(buildExercise(section.id, ex)));
    content.appendChild(sEl);
  });

  const addBtn = document.createElement('button');
  addBtn.className = 'btn-add-section';
  addBtn.innerHTML = '+ Añadir grupo de ejercicios';
  addBtn.onclick = () => openModal('modalNewSection');
  content.appendChild(addBtn);
}

function buildExercise(sectionId, ex) {
  const div = document.createElement('div');
  div.className = 'exercise';

  const top = document.createElement('div');
  top.className = 'exercise-top';

  const nameInput = document.createElement('input');
  nameInput.className = 'exercise-name';
  nameInput.value = ex.name;
  nameInput.placeholder = 'Nombre ejercicio';
  nameInput.onblur = () => { ex.name = nameInput.value; save(); };
  nameInput.onkeydown = e => { if (e.key === 'Enter') nameInput.blur(); };

  const delBtn = document.createElement('button');
  delBtn.className = 'btn-icon danger';
  delBtn.innerHTML = '✕';
  delBtn.onclick = () => deleteExercise(sectionId, ex.id);

  top.appendChild(nameInput);
  top.appendChild(delBtn);
  div.appendChild(top);

  const setsRow = document.createElement('div');
  setsRow.className = 'sets-row';

  function buildChips() {
    setsRow.innerHTML = '';
    ex.sets.forEach((val, si) => {
      const chip = document.createElement('div');
      chip.className = 'set-chip' + (si === ex.sets.length-1 ? ' last' : '');

      const wrap = document.createElement('div');
      wrap.className = 'set-input-wrap';

      const inp = document.createElement('input');
      inp.className = 'set-val';
      inp.type = 'text';
      inp.inputMode = 'decimal';
      inp.value = val;
      inp.placeholder = '—';
      // Only save on blur or Enter — never rerenders while typing
      inp.onblur = () => {
        ex.sets[si] = inp.value;
        save();
        // Update chip highlight class only, no rerender
        setsRow.querySelectorAll('.set-chip').forEach((c, i) => {
          c.className = 'set-chip' + (i === ex.sets.length-1 ? ' last' : '');
        });
      };
      inp.onkeydown = e => { if (e.key === 'Enter') inp.blur(); };

      wrap.appendChild(inp);

      const lbl = document.createElement('div');
      lbl.className = 'set-lbl';
      lbl.textContent = `S${si+1} · kg`;

      chip.appendChild(wrap);
      chip.appendChild(lbl);
      setsRow.appendChild(chip);
    });

    if (ex.sets.length > 1) {
      const rm = document.createElement('button');
      rm.className = 'btn-rm-set';
      rm.innerHTML = '−';
      rm.title = 'Quitar última serie';
      rm.onclick = () => { ex.sets.pop(); save(); buildChips(); };
      setsRow.appendChild(rm);
    }

    const add = document.createElement('button');
    add.className = 'btn-add-set';
    add.innerHTML = '+';
    add.title = 'Añadir serie';
    add.onclick = () => {
      ex.sets.push(ex.sets[ex.sets.length-1] || '');
      save(); buildChips();
    };
    setsRow.appendChild(add);
  }

  buildChips();
  div.appendChild(setsRow);
  return div;
}

// ── RENDER PROGRESS ──
function renderProgress() {
  // Collect all unique exercise names and their group
  const exMap = {}; // { "Group||exName": { group, name, points: [{date, max}] } }

  sortedDates().forEach(date => {
    const session = data[date];
    session.sections.forEach(section => {
      section.exercises.forEach(ex => {
        if (!ex.name.trim()) return;
        const maxVal = Math.max(...ex.sets.map(s => parseFloat(s) || 0));
        if (maxVal <= 0) return;
        const key = section.name + '||' + ex.name;
        if (!exMap[key]) exMap[key] = { group: section.name, name: ex.name, points: [] };
        // Avoid duplicate points for same date+key (e.g. two exercises with same name in same group)
        const alreadyHasDate = exMap[key].points.some(p => p.date === date);
        if (!alreadyHasDate) {
          exMap[key].points.push({ date, max: maxVal });
        } else {
          // Keep the higher value if duplicate
          const existing = exMap[key].points.find(p => p.date === date);
          if (maxVal > existing.max) existing.max = maxVal;
        }
      });
    });
  });

  // Build filters
  const groups = [...new Set(Object.values(exMap).map(e => e.group))];
  const filterRow = document.getElementById('filterRow');
  filterRow.innerHTML = '';

  const allChip = document.createElement('button');
  allChip.className = 'filter-chip' + (activeFilter === 'all' ? ' active' : '');
  allChip.textContent = 'Todos';
  allChip.onclick = () => { activeFilter = 'all'; renderProgress(); };
  filterRow.appendChild(allChip);

  groups.forEach(g => {
    const chip = document.createElement('button');
    chip.className = 'filter-chip' + (activeFilter === g ? ' active' : '');
    chip.textContent = g;
    chip.onclick = () => { activeFilter = g; renderProgress(); };
    filterRow.appendChild(chip);
  });

  const content = document.getElementById('progressContent');
  content.innerHTML = '';

  const entries = Object.entries(exMap)
    .filter(([, v]) => activeFilter === 'all' || v.group === activeFilter)
    .filter(([, v]) => v.points.length >= 1);

  if (entries.length === 0) {
    content.innerHTML = `<div class="no-progress"><div class="icon">📊</div><p>Aún no hay suficientes datos.<br>Añade más sesiones con pesos para ver tu progreso.</p></div>`;
    return;
  }

  entries.forEach(([key, info], idx) => {
    const name = info.name;
    const pts = info.points;
    const first = pts[0].max;
    const last = pts[pts.length-1].max;
    const diff = last - first;
    const pct = first > 0 ? ((diff/first)*100).toFixed(1) : 0;
    const isUp = diff > 0;

    const card = document.createElement('div');
    card.className = 'ex-progress-card';
    card.style.animationDelay = `${idx*0.04}s`;

    // Stats
    const diffStr = diff === 0 ? '=' : (diff > 0 ? `+${diff}` : `${diff}`);
    const trendColor = diff > 0 ? 'up' : 'same';

    card.innerHTML = `
      <div class="ex-progress-top">
        <div>
          <div class="ex-progress-name">${name}</div>
          <div class="ex-progress-group">${info.group}</div>
        </div>
        <div class="ex-stats">
          <div class="ex-stat">
            <div class="val ${trendColor}">${last} kg</div>
            <div class="lbl">MÁXIMO</div>
          </div>
          <div class="ex-stat">
            <div class="val ${trendColor}">${diffStr}</div>
            <div class="lbl">TOTAL</div>
          </div>
        </div>
      </div>
      <div class="chart-wrap" id="chart-${idx}"></div>
      <div class="chart-x-labels" id="xlabels-${idx}"></div>
    `;
    content.appendChild(card);

    // Draw SVG chart
    drawSparkline(card.querySelector(`#chart-${idx}`), card.querySelector(`#chart-${idx+'-' || ''}#xlabels-${idx}`), pts, idx, card);
  });
}

function drawSparkline(container, _, pts, idx, card) {
  const xlabelsEl = card.querySelector(`[id="xlabels-${idx}"]`);
  const H = 60;
  const values = pts.map(p => p.max);
  const minV = Math.min(...values);
  const maxV = Math.max(...values);
  const range = maxV - minV || 1;
  const N = pts.length;

  if (N === 1) {
    container.innerHTML = `<div style="text-align:center;font-size:11px;color:var(--muted);padding:10px 0;">Solo 1 sesión registrada. Añade más para ver la gráfica.</div>`;
    return;
  }

  const W = 500; // viewBox width
  const padX = 10;
  const usableW = W - padX * 2;

  const xOf = i => padX + (N === 1 ? usableW/2 : (i / (N-1)) * usableW);
  const yOf = v => H - 4 - ((v - minV) / range) * (H - 12);

  const points = pts.map((p, i) => `${xOf(i)},${yOf(p.max)}`).join(' ');
  const firstX = xOf(0), firstY = yOf(values[0]);
  const lastX = xOf(N-1), lastY = yOf(values[N-1]);

  // Gradient fill path
  const fillPath = `M${xOf(0)},${H} L${points.split(' ').map((p,i) => i===0 ? `${xOf(0)},${yOf(values[0])}` : p).join(' L')} L${xOf(N-1)},${H} Z`;
  const linePath = `M ${points.split(' ').join(' L ')}`;

  const svgId = `svg-grad-${idx}`;
  const svg = `<svg class="sparkline" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="${svgId}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#c8f135" stop-opacity="0.25"/>
        <stop offset="100%" stop-color="#c8f135" stop-opacity="0.01"/>
      </linearGradient>
    </defs>
    <path d="${fillPath}" fill="url(#${svgId})"/>
    <polyline points="${points}" fill="none" stroke="#c8f135" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p, i) => {
      const x = xOf(i), y = yOf(p.max);
      const isFirst = i === 0, isLast = i === N-1;
      const r = (isFirst || isLast) ? 4 : 3;
      const fill = isLast ? '#c8f135' : '#0a0a0a';
      const stroke = '#c8f135';
      return `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>
              <text x="${x}" y="${y - 7}" text-anchor="middle" font-size="9" fill="#c8f135" font-family="DM Sans, sans-serif">${p.max}</text>`;
    }).join('')}
  </svg>`;

  container.innerHTML = svg;

  // X labels: show first, last, and up to 3 middle
  if (xlabelsEl) {
    xlabelsEl.innerHTML = '';
    const showIdx = N <= 4
      ? pts.map((_,i) => i)
      : [0, Math.floor(N/3), Math.floor(2*N/3), N-1];
    const unique = [...new Set(showIdx)];
    xlabelsEl.style.position = 'relative';
    unique.forEach(i => {
      const sp = document.createElement('span');
      sp.textContent = shortDate(pts[i].date);
      sp.style.position = 'absolute';
      sp.style.left = `${(xOf(i) / W * 100)}%`;
      sp.style.transform = 'translateX(-50%)';
      sp.style.fontSize = '9px';
      sp.style.color = 'var(--muted)';
      xlabelsEl.appendChild(sp);
    });
    xlabelsEl.style.height = '14px';
  }
}

// ── ACTIONS ──
function addExercise(sectionId) {
  const s = findSection(sectionId);
  if (!s) return;
  s.exercises.push({ id: uid(), name: '', sets: [''] });
  save(); renderLog();
  setTimeout(() => {
    const inputs = document.querySelectorAll('.exercise-name');
    if (inputs.length) inputs[inputs.length-1].focus();
  }, 50);
}
function deleteExercise(sectionId, exId) {
  const s = findSection(sectionId);
  if (!s) return;
  s.exercises = s.exercises.filter(e => e.id !== exId);
  save(); renderLog();
}
function deleteSection(sectionId) {
  if (!currentDate) return;
  const s = findSection(sectionId);
  if (s && s.exercises.length > 0 && !confirm(`¿Eliminar "${s.name}" y todos sus ejercicios?`)) return;
  data[currentDate].sections = data[currentDate].sections.filter(s => s.id !== sectionId);
  save(); renderLog();
}
function findSection(sectionId) {
  if (!currentDate || !data[currentDate]) return null;
  return data[currentDate].sections.find(s => s.id === sectionId);
}

// ── MODALS ──
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function openNewSession() {
  document.getElementById('newSessionDate').value = new Date().toISOString().split('T')[0];
  openModal('modalNewSession');
}
function confirmNewSession() {
  const d = document.getElementById('newSessionDate').value;
  if (!d) return;
  if (!data[d]) {
    const dates = sortedDates();
    if (dates.length > 0) {
      const last = data[dates[dates.length-1]];
      data[d] = { sections: last.sections.map(s => ({
        id: uid(), name: s.name,
        exercises: s.exercises.map(e => ({ id: uid(), name: e.name, sets: e.sets.map(() => '') }))
      }))};
    } else {
      data[d] = { sections: [] };
    }
    save();
  }
  currentDate = d;
  closeModal('modalNewSession');
  renderLog();
  showToast('Sesión creada: ' + formatDate(d));
}
function confirmNewSection() {
  const name = document.getElementById('newSectionName').value.trim();
  if (!name || !currentDate) return;
  data[currentDate].sections.push({ id: uid(), name, exercises: [] });
  save();
  document.getElementById('newSectionName').value = '';
  closeModal('modalNewSection');
  renderLog();
}
function openRenameSection(sectionId) {
  renameSectionId = sectionId;
  const s = findSection(sectionId);
  if (!s) return;
  document.getElementById('renameSectionVal').value = s.name;
  openModal('modalRenameSection');
}
function confirmRenameSection() {
  const val = document.getElementById('renameSectionVal').value.trim();
  if (!val || !renameSectionId) return;
  const s = findSection(renameSectionId);
  if (s) { s.name = val; save(); renderLog(); }
  closeModal('modalRenameSection');
  renameSectionId = null;
}

// ── HISTORY ──
function openHistory() {
  const list = document.getElementById('historyList');
  list.innerHTML = '';
  const dates = sortedDates().reverse();
  if (!dates.length) {
    list.innerHTML = '<div class="no-history">No hay sesiones registradas.</div>';
  } else {
    dates.forEach(d => {
      const session = data[d];
      const exCount = session.sections.reduce((a,s) => a+s.exercises.length, 0);
      const entry = document.createElement('div');
      entry.className = 'history-entry' + (d===currentDate ? ' active-entry' : '');
      entry.innerHTML = `
        <div>
          <div class="h-date">${formatDate(d)}</div>
          <div class="h-exercises">${session.sections.length} grupos · ${exCount} ejercicios</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="h-icon">→</span>
          <button onclick="deleteSessionBtn('${d}',event)" style="background:none;border:1px solid #333;color:#555;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:11px;" onmouseover="this.style.borderColor='#ff4d4d';this.style.color='#ff4d4d'" onmouseout="this.style.borderColor='#333';this.style.color='#555'">✕</button>
        </div>
      `;
      entry.onclick = e => {
        if (e.target.tagName==='BUTTON') return;
        currentDate = d; closeHistory(); renderLog();
      };
      list.appendChild(entry);
    });
  }
  document.getElementById('historyPanel').classList.add('open');
}
function deleteSessionBtn(d, e) {
  e.stopPropagation();
  pendingDeleteDate = d;
  document.getElementById('confirmDeleteLabel').textContent = formatDate(d);
  document.getElementById('modalConfirmDelete').classList.add('open');
}
function confirmDeleteSession() {
  if (!pendingDeleteDate) return;
  const toDelete = pendingDeleteDate;
  _deleteFromStorage(toDelete).catch(e => console.warn(e));
  delete data[toDelete];
  if (currentDate === toDelete) {
    const dates = sortedDates();
    currentDate = dates.length ? dates[dates.length-1] : null;
  }
  pendingDeleteDate = null;
  closeModal('modalConfirmDelete');
  openHistory(); renderLog();
}
function closeHistory() { document.getElementById('historyPanel').classList.remove('open'); }

// ── TOAST ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ── LOADING ──
function showLoading(on) {
  let el = document.getElementById('loadingOverlay');
  if (on) {
    if (!el) {
      el = document.createElement('div');
      el.id = 'loadingOverlay';
      el.style.cssText = 'position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;align-items:center;justify-content:center;';
      el.innerHTML = '<div style="text-align:center"><div style="font-family:Bebas Neue,sans-serif;font-size:32px;letter-spacing:3px;color:var(--accent)">GYM LOG</div><div style="font-size:12px;color:var(--muted);margin-top:8px;letter-spacing:1px;">Cargando...</div></div>';
      document.body.appendChild(el);
    }
    el.style.display = 'flex';
  } else {
    if (el) el.style.display = 'none';
  }
}

// ── CLICK OUTSIDE ──
document.querySelectorAll('.modal-overlay').forEach(o => {
  o.addEventListener('click', e => { if (e.target===o) o.classList.remove('open'); });
});
document.getElementById('historyPanel').addEventListener('click', e => {
  if (e.target===document.getElementById('historyPanel')) closeHistory();
});
document.getElementById('newSessionDate').addEventListener('keydown', e => { if(e.key==='Enter') confirmNewSession(); });
document.getElementById('newSectionName').addEventListener('keydown', e => { if(e.key==='Enter') confirmNewSection(); });
document.getElementById('renameSectionVal').addEventListener('keydown', e => { if(e.key==='Enter') confirmRenameSection(); });

// ── INIT ──
(async () => {
  showLoading(true);
  await load();
  showLoading(false);
  const _dates = sortedDates();
  currentDate = _dates.length ? _dates[_dates.length-1] : null;
  renderLog();
})();
</script>
